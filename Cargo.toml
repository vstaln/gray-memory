[package]
name = "gray-memory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Curated cross-session memory for the gray agent harness (wire v1.1)."

[[bin]]
name = "gray-memory"
path = "src/main.rs"

[lib]
name = "gray_memory"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
